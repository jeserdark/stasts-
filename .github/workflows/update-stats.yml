name: Actualizar estadísticas

on:
  schedule:
    - cron: '17 13 1,16 * *'   # días 1 y 16 de cada mes, 8:17 a. m. hora Colombia
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]        # publica también cuando subes cambios a la página

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  stats-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consultar Instagram y escribir stats.json
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/update-stats.mjs
      - name: Guardar cambios
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Estadísticas actualizadas" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
